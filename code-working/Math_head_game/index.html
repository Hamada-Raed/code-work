<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Head Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
 
    <h1>Math Head Game</h1>
<p>Move your head to select the correct answer!</p>
 
    <div class="game-container">
<video id="camera" autoplay playsinline></video>
<div id="options">
<div id="optionLeft" class="option">+</div>
<div id="optionRight" class="option">-</div>
</div>
<div id="equation">Equation: <span id="equationText"></span></div>
</div>
 
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-detection@0.0.1/dist/face-detection.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="game.js"></script>
 
</body>
</html>
